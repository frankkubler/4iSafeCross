services:
  app:
    image: registry.gitlab.4itec.ddns.net/frank-k/4isafecross:latest-amd64
    container_name: 4isafecross
    restart: unless-stopped
    network_mode: host
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Europe/Paris
      - LICENSE_DIR=/app/licenses
      # Forcer le décodage H.264 logiciel (CPU) sur Intel iGPU Docker.
      # Le driver iHD >= 23.x crash (SIGABRT) quand vah264dec ouvre un
      # contexte VA-API depuis un thread secondaire Python.
      # Retirer cette ligne pour réactiver le décodage GPU (vaapi_new)
      # si le driver est mis à jour et corrige ce bug.
      - GSTREAMER_BACKEND=vaapi_new
      - LIBVA_DRIVER_NAME=iHD
      - GST_PLUGIN_FEATURE_RANK=vah264dec:MAX


    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "992"

    volumes:
      - /data/4isafecross:/app/data
      - ./licenses:/app/licenses

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:5050/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
