services:
  app:
    # Tag deploye : SAFECROSS_TAG, ecrit dans .env par scripts/deploy-jetson.sh
    # (docker compose lit .env tout seul). Defaut latest-arm64 = mise au point ;
    # en production, un tag fige v<x.y.z>-arm64 (CS-1141-01).
    image: registry.gitlab.4itec.ddns.net/frank-k/4isafecross:${SAFECROSS_TAG:-latest-arm64}
    container_name: 4isafecross
    network_mode: host
    runtime: nvidia
    privileged: true
    restart: unless-stopped
    ipc: host
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Europe/Paris
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LICENSE_DIR=/app/licenses
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    devices:
      - /dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu
      - /dev/nvhost-prof-gpu
      - /dev/nvmap
      - /dev/nvhost-vic
      - /dev/video0
      - /dev/video1
    
    volumes:
      # État mutable au runtime — doit survivre à une mise à jour d'image.
      # config/ est réécrit par l'éditeur de zones, db/ porte l'historique des
      # relais. Sans ces montages, un `docker compose pull && up` efface la
      # géométrie des zones du site et la traçabilité des alertes.
      #
      # ⚠️  PREMIER DÉPLOIEMENT : amorcer /data/4isafecross depuis l'image,
      # sinon config/ est vide et l'application ne démarre pas :
      #   sudo mkdir -p /data/4isafecross/{config,db,detections,dataset}
      #   docker run --rm --entrypoint tar <image> -C /app -c config db \
      #     | sudo tar -C /data/4isafecross -x
      # (scripts/deploy-jetson.sh effectue cet amorçage automatiquement.)
      - /data/4isafecross/config:/app/config
      - /data/4isafecross/db:/app/db
      - /data/4isafecross/detections:/app/detections
      - /data/4isafecross/dataset:/app/dataset
      # Journal d'audit JSON (CS-144-01 / CS-R2-03) — doit survivre aux MAJ d'image.
      - /data/4isafecross/logs:/app/logs
      - ./licenses:/app/licenses
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/enctune.conf:/etc/enctune.conf:ro
      - /etc/machine-id:/etc/machine-id:ro
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:5050/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
