[logging]
# Niveau de log : DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

[TELEGRAM]
# Token et Chat ID à définir via variables d'environnement (NE PAS mettre ici).
# Exporter avant de lancer l'application :
#   export TELEGRAM_TOKEN="<token>"
#   export TELEGRAM_CHAT_ID="<chat_id>"
# Ou renseigner dans .env (voir .env.example) chargé par le service systemd.
# Les valeurs ci-dessous ne sont utilisées qu'en dernier recours (développement local).
TOKEN =
CHAT_ID =
TELEGRAM_ENABLED = false

[APP]
# Version de l'application
APP_VERSION = 3.0.2
# Seuil de pixels blancs pour la détection de mouvement
MOTIONTHRESHOLD = 10000
# Paramètres du détecteur de fond MOG2
# Nombre de frames pour l'historique du modèle de fond (500 = fond s'adapte plus lentement, piétons lents non absorbés)
FGBG_HISTORY = 500
# Seuil de variance pour la classification pixel/fond
# (10 = compromis : détecte les piétons en fond, moins FP que 5)
# Réduire vers 5 si des piétons lointains sont ratés, augmenter vers 16 si trop de FP lumiere/vibrations
FGBG_VAR_THRESHOLD = 10
# Activer la détection des ombres (ombres codées à 127, filtrées par le seuil binaire à 200)
FGBG_DETECT_SHADOWS = true
# Hystérésis temporelle : frames consécutives pour confirmer ON / confirmer OFF
MOTION_ON_FRAMES = 2
MOTION_OFF_FRAMES = 5
# Flou gaussien 5x5 avant MOG2 pour atténuer le bruit capteur (~2ms sur Jetson)
MOTION_GAUSSIAN_BLUR = true
# Filtre aspect ratio h/w < 0.3 pour exclure les artefacts horizontaux (vibrations)
# Désactivé par défaut pour éviter les régressions
MOTION_ASPECT_FILTER = false
# Surface minimale d'un seul contour pour déclencher le mouvement (indépendamment du total)
# 1500 = attrape les petits contours de piétons en fond, sans déclencher sur le bruit pur
MOTION_MIN_SINGLE_CONTOUR = 1500
# Nom de l'application
APP_NAME = 4iSafeCross
# Seuil de confiance pour l'inférence
INF_THRESHOLD = 0.7
# Chemin vers la base de données des détections
DB_PATH = db/detections.db
# Rétention des événements relais en base SQLite (RGPD Art. 5-1-e)
# Durée en jours avant suppression automatique (recommandation : 365 jours)
RELAY_EVENTS_KEEP_DAYS = 365
# Rétention des images de détection (debug/maintenance)
# Nombre maximum de fichiers JPG conservés dans detections/
DETECTION_FILES_MAX = 30
# Durée de conservation en jours (les fichiers plus anciens sont supprimés automatiquement)
DETECTION_FILES_KEEP_DAYS = 30
# Collecte automatique du dataset (thread intégré, zéro surcharge IA/GStreamer)
# Activer ici plutôt que de lancer collect_dataset.py en parallèle de app.py
DATASET_COLLECTION = false
DATASET_COLLECTION_INTERVAL = 10
DATASET_COLLECTION_START_HOUR = 5
DATASET_COLLECTION_END_HOUR = 17
DATASET_COLLECTION_MAX_PER_CLASS_PER_HOUR = 30
DATASET_OUTPUT_DIR = dataset
# Durée de rétention des images dataset sur disque (sécurité RGPD — suppression manuelle recommandée après entraînement)
DATASET_FILES_KEEP_DAYS = 90
# Background : frames sans détection ni mouvement (label vide)
# Intervalle en minutes entre deux captures background
DATASET_BG_ENABLED = false
DATASET_BG_INTERVAL = 30
# Hard negative : faux positifs potentiels (poteaux, reflets) détectés à seuil bas
# Seuil de confiance bas pour l'inférence hard_neg (typiquement 0.25-0.40)
DATASET_HARD_NEG_ENABLED = false
DATASET_HARD_NEG_CONFIDENCE = 0.35
# Mode de détection : simple ou extended ou transfert
DETECTION = transfert
# Activer l'estimation de pose (keypoints) — mettre false pour gagner ~30-50ms par détection personne
POSE_ENABLED = false
# Classes utilisées pour chaque mode de détection YOLOv11 - 1: "person", 3: "car", 6: "bus", 7: "train", 8: "truck"
EXTENDED_CLASSES = [1, 3, 6, 7, 8]
# Classes utilisées pour le mode de détection pour modèle de transfert learning (fine-tuning)
# Modèle courant (4isafecross-5th) : 0: "Forklift", 1: "Driver", 2: "Person"
# La liste reste un sur-ensemble (0-5) pour rester tolérante si un modèle à six
# classes revient ; elle ne filtre donc rien aujourd'hui.
TRANSFERT_CLASSES = [0, 1, 2, 3, 4, 5]
# Sous-ensemble "simple" : Driver + Person avec le modèle courant.
SIMPLE_CLASSES = [1 , 2]
# Temps d'attente avant test RTSP (en secondes)
WAIT_BEFORE_TEST_RTSP = 3
# Délai accordé à la première image d'un flux après la mise en PLAYING (secondes).
# Négociation RTSP + attente d'une image clé : dépasse souvent 1 s sur caméra PoE.
RTSP_FIRST_FRAME_TIMEOUT = 15
# Silence toléré une fois le flux établi avant de déclarer la perte (secondes).
RTSP_FRAME_LOSS_TIMEOUT = 1
# Période de grâce fail-safe au démarrage avant extinction initiale des relais (en secondes)
STARTUP_GRACE_PERIOD = 15
# Paramètres d'inférence /predict_frame_rf_detr/ or /predict_frame/
FONCTION_RFDETR = predict_frame_rf_detr
URL_RFDETR = http://127.0.0.1:8002
# for predict_frame/
FONCTION_YOLO = predict_frame
URL_YOLO = http://127.0.0.1:8004


[RTSP]
# Identifiants pour les caméras RTSP
# NE PAS mettre ici des credentials réels.
# Définir via variables d'environnement (recommandé) :
#   export RTSP_LOGIN="<login>" RTSP_PASSWORD="<password>"
# Ou renseigner dans .env (voir .env.example).
# Les valeurs ci-dessous ne sont utilisées qu'en dernier recours (développement local).
LOGIN =
PASSWORD =
# Liste des adresses IP des caméras (format liste Python).
# L'ORDRE fixe l'index des caméras : 1er hôte = index 0 = zones/masques _cam0 =
# vue « Camera 1 » ; 2e hôte = index 1 = _cam1 = « Camera 2 ». Ne pas intervertir.
# Plan d'adressage standard (2026-09-10) : chaque caméra dans son propre /24,
# segments dédiés et isolés (sans passerelle) ; le Jetson porte une adresse par
# sous-réseau — scripts/setup-camera-net.sh.
#   - Caméra 1 (index 0) : 172.16.10.169  →  Jetson 172.16.10.1/24
#   - Caméra 2 (index 1) : 172.16.11.91   →  Jetson 172.16.11.1/24
HOST = ["172.16.10.169", "172.16.11.91"]
# Site HAM (en service sur le plan précédent, migration ultérieure) : ["192.168.2.156", "192.168.2.157"]
# Schéma de transport : rtsp (clair) ou rtsps (RTSP/média sur TLS).
# TESTÉ exhaustivement sur cible (VIGI S485/S455) : aucun transport RTSP chiffré
# standard — 554 clair (RTP/AVP), 322/8554 fermés, 8443 = service propriétaire
# 'Streamd', 8800 = binaire, SRTP=On casse tout client tiers (400). Le SRTP VIGI
# est réservé aux NVR VIGI. → SCHEME = rtsp + dérogation CS-1143-01 (impossibilité
# matérielle). Mesures : Digest MD5/SHA-256 (rtspsrc le négocie — vérifié ;
# ffmpeg/VLC échouent sur le défi multi-algorithmes, sans impact sur l'app ;
# la caméra accepte aussi Basic, non désactivable) ; segment caméras dédié isolé
# (scripts/setup-camera-net.sh) ; durcissement caméra (SNMP/RTMP/DDNS/ONVIF off).
# Passer à rtsps UNIQUEMENT avec des caméras à RTSP/TLS (le code le gère —
# cf. docs/deployment/scripts-deploiement.md § « Transport des flux caméras »).
SCHEME = rtsp
# Port RTSP (VIGI : 554).
PORT = 554
# Nom du stream (VIGI : stream1 = flux principal, stream2 = flux secondaire)
STREAM = stream1
# Optionnel (SCHEME=rtsps uniquement) : PEM pour épingler le certificat caméra.
TLS_CA =

[STATURE_COLORS]
# Couleurs pour les différentes statures de personnes détectées (format RGB)
# debout : Personne debout (vert)
debout = (0, 255, 0)
# assis : Personne assise (rouge)
assis = (255, 0, 0)
# marchant : Personne en marche (cyan)
marchant = (0, 255, 255)
# jambes_masquees : Jambes masquées/ocultées (magenta)
jambes_masquees = (255, 0, 255)
# inconnu : Stature inconnue (bleu)
inconnu = (0, 0, 255)
# conducteur : Conducteur de véhicule (orange)
conducteur = (255, 165, 0)
# pieton : Piéton (violet)
pieton = (128, 0, 128)

[OBJECT_COLORS]
# Couleurs pour les différents types d'objets détectés (format RGB)
person = (0, 255, 0)  # Vert
forklift = (255, 0, 0) # Rouge
driver = (0, 0, 255) # Bleu
unknown = (255, 255, 0) # Jaune
