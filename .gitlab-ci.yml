# Pipeline GitLab CI/CD pour images Docker multi-arch
# ARM64 (Jetson Orin NX) + AMD64 (Intel/x86_64 iGPU)
# Code protege par conteneur signe

stages:
  - security
  - build
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

security:sast:
  stage: security
  image: python:3.10-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libglib2.0-dev libgirepository1.0-dev pkg-config libffi-dev libcairo2-dev && apt-get clean && rm -rf /var/lib/apt/lists/*
    - pip install uv --quiet --no-cache-dir
    # Outillage epingle par [dependency-groups] dev de pyproject.toml + uv.lock :
    # la version de bandit/pip-audit qui tourne ici est celle du lock, pas la
    # derniere publiee. --only-group evite d'installer opencv/pygobject, inutiles
    # pour l'analyse statique.
    - uv sync --frozen --only-group dev
  script:
    - echo "=== Analyse SAST avec Bandit ==="
    # Le passage JSON tolere l'echec pour que l'artefact soit toujours produit
    # (bandit ecrit le rapport puis sort en code != 0 s'il trouve quelque chose).
    # Le passage lisible qui suit ne tolere PAS l'echec : c'est lui qui fait
    # echouer le job. Avec allow_failure: false (voir plus bas), une decouverte
    # bandit OU pip-audit casse desormais le pipeline (CYBER_AUDIT.md CS-R6-01 ;
    # TECH_DEBT_AUDIT.md F043).
    - .venv/bin/bandit -r src/ utils/ run.py -ll -f json -o bandit-report.json || true
    - .venv/bin/bandit -r src/ utils/ run.py -ll
    - echo "=== Audit des dependances avec pip-audit ==="
    - >
      uv pip compile pyproject.toml
      --extra-index-url "https://${GITLAB_DEPLOY_USERNAME_38}:${GITLAB_DEPLOY_TOKEN_38}@gitlab.4itec.ddns.net/api/v4/projects/38/packages/pypi/simple"
      --output-file /tmp/audit-requirements.txt
    - wc -l /tmp/audit-requirements.txt
    # --no-deps --disable-pip : le fichier compile est deja entierement epingle,
    # donc aucune resolution n'est necessaire. Sans ces options pip-audit cree un
    # venv et y relance `pip install`, sans l'index prive du projet 38 -> echec sur
    # `license-validator==0.2.2` (introuvable sur PyPI). Avec elles, pip n'est
    # jamais invoque : license-validator est reporte comme "skipped" dans le
    # rapport, ce qui est correct — c'est un paquet interne, aucune base d'avis
    # publique (PyPI/OSV) ne le referencera jamais.
    - >
      .venv/bin/pip-audit -r /tmp/audit-requirements.txt --no-deps --disable-pip
      --progress-spinner off -f json -o pip-audit-report.json || true
    - >
      .venv/bin/pip-audit -r /tmp/audit-requirements.txt --no-deps --disable-pip
      --progress-spinner off
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - pip-audit-report.json
    expire_in: 30 days
  # BLOQUANT (CYBER_AUDIT.md CS-R6-01, TECH_DEBT_AUDIT.md F043) : une decouverte
  # bandit (-ll) ou pip-audit fait echouer le pipeline. Deroger ponctuellement
  # via un commit explicite si un correctif de dependance n'est pas encore dispo.
  allow_failure: false
  only:
    - main
    - merge_requests

# ─── Detection de secrets (gitleaks) ────────────────────────────────────────
# BLOQUANT : un secret (token, cle, mot de passe) dans le code OU dans
# l'historique git fait echouer le pipeline. Voir CYBER_AUDIT.md, CS-113-04.
# L'historique a ete purge le 2026-08-31 (git filter-repo) : ce job doit etre vert.
security:gitleaks:
  stage: security
  image:
    name: "ghcr.io/gitleaks/gitleaks:v$GITLEAKS_VERSION"
    entrypoint: [""]
  variables:
    GITLEAKS_VERSION: "8.21.2"
    GIT_DEPTH: 0          # historique complet requis pour scanner tout le passe
  script:
    - gitleaks version
    # 'gitleaks git' = ancien 'gitleaks detect' : scan de TOUT l'historique.
    - gitleaks git --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif --verbose .
    # Variante intermediaire (arbre de travail seulement), en attendant la purge :
    # - gitleaks dir --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif --verbose .
  artifacts:
    when: always
    paths:
      - gitleaks.sarif
    expire_in: 30 days
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ─── Build image Docker ARM64 (Jetson Orin NX) ───────────────────────────────
build:docker:arm64:
  stage: build
  image: docker:25-cli
  # Le runner expose le daemon Docker de l'hote (socket monte) : les deux jobs de
  # build partagent le meme daemon, d'ou la serialisation. Pas de service dind,
  # il ne demarre pas sur ce runner et n'est pas utilise.
  resource_group: docker-host
  before_script:
    - df -h
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # binfmt officiel buildx (QEMU 9) ; version epinglee car conteneur privilegie
    - docker run --rm --privileged tonistiigi/binfmt:qemu-v9.2.2 --install arm64
  script:
    - echo "Construction de l'image Docker ARM64..."
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    # Tags contextuels : latest-* reserve a main/tags (deploiements production),
    # les branches produisent <slug-de-branche>-arm64 sans toucher latest.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64 --tag ${IMAGE_NAME}:latest-arm64"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:latest-arm64"
      else
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-arm64"
      fi
      docker buildx build \
        --platform linux/arm64 \
        --target final-arm64 \
        --build-arg UV_INDEX_USERNAME=${GITLAB_DEPLOY_USERNAME_38} \
        --secret id=uv_index_token,env=GITLAB_DEPLOY_TOKEN_38 \
        --tag ${IMAGE_NAME}:${IMAGE_TAG}-arm64 \
        $EXTRA_TAGS \
        --push --progress=plain .
    - echo "Image creee ${IMAGE_NAME}:${IMAGE_TAG}-arm64"
  after_script:
    # Nettoyage borne. Surtout PAS `system prune -af --volumes` : le daemon est
    # partage avec le reste de l'hote et sa GC supprime les blobs en cours de
    # pull des autres jobs (echecs "no such file or directory" dans containerd).
    - docker buildx prune -f --keep-storage 10GB || true
    - docker image prune -f || true
    - df -h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    # Branches : build a la demande (bouton "play" dans le pipeline),
    # allow_failure pour ne pas bloquer le statut du pipeline.
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

# ─── Build image Docker AMD64 (Intel iGPU / x86_64) ──────────────────────────
build:docker:amd64:
  stage: build
  image: docker:25-cli
  # Meme daemon hote que le build ARM64 : les deux ne doivent pas tourner ensemble.
  resource_group: docker-host
  before_script:
    - df -h
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Construction de l'image Docker AMD64..."
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    # Tags contextuels : latest-* reserve a main/tags (deploiements production),
    # les branches produisent <slug-de-branche>-amd64 sans toucher latest.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64 --tag ${IMAGE_NAME}:latest-amd64"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:latest-amd64"
      else
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-amd64"
      fi
      docker buildx build \
        --platform linux/amd64 \
        --target final-amd64 \
        --build-arg UV_INDEX_USERNAME=${GITLAB_DEPLOY_USERNAME_38} \
        --secret id=uv_index_token,env=GITLAB_DEPLOY_TOKEN_38 \
        --tag ${IMAGE_NAME}:${IMAGE_TAG}-amd64 \
        $EXTRA_TAGS \
        --push --progress=plain .
    - echo "Image creee ${IMAGE_NAME}:${IMAGE_TAG}-amd64"
  after_script:
    # Idem ARM64 : nettoyage borne, jamais de prune global sur le daemon partage.
    - docker buildx prune -f --keep-storage 10GB || true
    - docker image prune -f || true
    - df -h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

# ─── Release avec instructions de deploiement ────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies: []
  script:
    - echo "Creation de la release ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      ## Release Docker Multi-Arch $CI_COMMIT_TAG

      ### Images disponibles

      | Architecture | Image |
      |---|---|
      | ARM64 (Jetson Orin NX) | `${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64` |
      | AMD64 (Intel iGPU)     | `${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64` |

      ### Deploiement ARM64 (Jetson)
      ```bash
      docker login registry.gitlab.4itec.ddns.net
      docker pull ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64
      docker run -d \
        --name 4isafecross \
        --runtime nvidia \
        --restart unless-stopped \
        --privileged \
        -p 5050:5050 \
        -v /data/4isafecross:/app/data \
        ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64
      ```

      ### Deploiement AMD64 (Intel iGPU)
      ```bash
      docker login registry.gitlab.4itec.ddns.net
      docker pull ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64
      docker run -d \
        --name 4isafecross \
        --restart unless-stopped \
        --device /dev/dri \
        -p 5050:5050 \
        -v /data/4isafecross:/app/data \
        ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64
      ```

      **Verifier les logs:**
      ```bash
      docker logs -f 4isafecross
      ```
  only:
    - tags
  except:
    - branches