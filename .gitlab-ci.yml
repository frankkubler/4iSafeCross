# Pipeline GitLab CI/CD pour images Docker multi-arch
# ARM64 (Jetson Orin NX) + AMD64 (Intel/x86_64 iGPU)
# Code protege par conteneur signe

stages:
  - security
  - build
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

security:sast:
  stage: security
  image: python:3.10-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libglib2.0-dev libgirepository1.0-dev pkg-config libffi-dev libcairo2-dev && apt-get clean && rm -rf /var/lib/apt/lists/*
    - pip install bandit pip-audit uv --quiet --no-cache-dir
  script:
    - echo "=== Analyse SAST avec Bandit ==="
    - bandit -r src/ utils/ run.py -ll -f json -o bandit-report.json 2>&1 || echo "Bandit completed with warnings"
    - bandit -r src/ utils/ run.py -ll 2>&1 || echo "Bandit completed with warnings"
    - echo "=== Audit des dependances avec pip-audit ==="
    - >
      uv pip compile pyproject.toml
      --extra-index-url "https://${GITLAB_DEPLOY_USERNAME_38}:${GITLAB_DEPLOY_TOKEN_38}@gitlab.4itec.ddns.net/api/v4/projects/38/packages/pypi/simple"
      --output-file /tmp/audit-requirements.txt
    - test -f /tmp/audit-requirements.txt && wc -l /tmp/audit-requirements.txt || echo "Failed to compile requirements"
    - pip-audit -r /tmp/audit-requirements.txt -f json -o pip-audit-report.json 2>&1 || echo "Pip-audit found issues (see below)"
    - pip-audit -r /tmp/audit-requirements.txt 2>&1 || echo "Audit complete"
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - pip-audit-report.json
    expire_in: 30 days
  allow_failure: true
  only:
    - main
    - merge_requests

# ─── Build image Docker ARM64 (Jetson Orin NX) ───────────────────────────────
build:docker:arm64:
  stage: build
  image: docker:25-cli
  services:
    - docker:25-dind
  before_script:
    - echo "Nettoyage de l'espace disque..."
    - docker system prune -af --volumes || true
    - df -h
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # binfmt officiel buildx (QEMU 9, image statique) — multiarch/qemu-user-static
    # est abandonné (QEMU 7) et son layer usr-merge plante l'extraction containerd
    - docker run --rm --privileged tonistiigi/binfmt --install arm64
  script:
    - echo "Construction de l'image Docker ARM64..."
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    # Tags contextuels : latest-* reserve a main/tags (deploiements production),
    # les branches produisent <slug-de-branche>-arm64 sans toucher latest.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64 --tag ${IMAGE_NAME}:latest-arm64"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:latest-arm64"
      else
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-arm64"
      fi
      docker buildx build \
        --platform linux/arm64 \
        --target final-arm64 \
        --build-arg UV_INDEX_USERNAME=${GITLAB_DEPLOY_USERNAME_38} \
        --secret id=uv_index_token,env=GITLAB_DEPLOY_TOKEN_38 \
        --tag ${IMAGE_NAME}:${IMAGE_TAG}-arm64 \
        $EXTRA_TAGS \
        --push --progress=plain .
    - echo "Image creee ${IMAGE_NAME}:${IMAGE_TAG}-arm64"
  after_script:
    - docker system prune -f || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    # Branches : build a la demande (bouton "play" dans le pipeline),
    # allow_failure pour ne pas bloquer le statut du pipeline.
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

# ─── Build image Docker AMD64 (Intel iGPU / x86_64) ──────────────────────────
build:docker:amd64:
  stage: build
  image: docker:25-cli
  services:
    - docker:25-dind
  before_script:
    - echo "Nettoyage de l'espace disque..."
    - docker system prune -af --volumes || true
    - df -h
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Construction de l'image Docker AMD64..."
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    # Tags contextuels : latest-* reserve a main/tags (deploiements production),
    # les branches produisent <slug-de-branche>-amd64 sans toucher latest.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64 --tag ${IMAGE_NAME}:latest-amd64"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        EXTRA_TAGS="--tag ${IMAGE_NAME}:latest-amd64"
      else
        EXTRA_TAGS="--tag ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-amd64"
      fi
      docker buildx build \
        --platform linux/amd64 \
        --target final-amd64 \
        --build-arg UV_INDEX_USERNAME=${GITLAB_DEPLOY_USERNAME_38} \
        --secret id=uv_index_token,env=GITLAB_DEPLOY_TOKEN_38 \
        --tag ${IMAGE_NAME}:${IMAGE_TAG}-amd64 \
        $EXTRA_TAGS \
        --push --progress=plain .
    - echo "Image creee ${IMAGE_NAME}:${IMAGE_TAG}-amd64"
  after_script:
    - docker system prune -f || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

# ─── Release avec instructions de deploiement ────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies: []
  script:
    - echo "Creation de la release ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      ## Release Docker Multi-Arch $CI_COMMIT_TAG

      ### Images disponibles

      | Architecture | Image |
      |---|---|
      | ARM64 (Jetson Orin NX) | `${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64` |
      | AMD64 (Intel iGPU)     | `${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64` |

      ### Deploiement ARM64 (Jetson)
      ```bash
      docker login registry.gitlab.4itec.ddns.net
      docker pull ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64
      docker run -d \
        --name 4isafecross \
        --runtime nvidia \
        --restart unless-stopped \
        --privileged \
        -p 5050:5050 \
        -v /data/4isafecross:/app/data \
        ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64
      ```

      ### Deploiement AMD64 (Intel iGPU)
      ```bash
      docker login registry.gitlab.4itec.ddns.net
      docker pull ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64
      docker run -d \
        --name 4isafecross \
        --restart unless-stopped \
        --device /dev/dri \
        -p 5050:5050 \
        -v /data/4isafecross:/app/data \
        ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64
      ```

      **Verifier les logs:**
      ```bash
      docker logs -f 4isafecross
      ```
  only:
    - tags
  except:
    - branches