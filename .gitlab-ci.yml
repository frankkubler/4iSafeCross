# Pipeline GitLab CI/CD pour images Docker multi-arch
# ARM64 (Jetson Orin NX) + AMD64 (Intel/x86_64 iGPU)
# Code protege par conteneur signe

stages:
  - security   # fail fast : scan SAST + audit dependances avant tout build
  - build
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

# ─── Stage security : SAST (Bandit) + audit dependances (pip-audit) ──────────
security:sast:
  stage: security
  image: python:3.10-slim
  before_script:
    - pip install bandit pip-audit --quiet
  script:
    - echo "=== Analyse SAST avec Bandit ==="
    - bandit -r src/ utils/ app.py -ll -f json -o bandit-report.json || true
    - bandit -r src/ utils/ app.py -ll
    - echo "=== Audit des dependances avec pip-audit ==="
    - pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
    - pip-audit -r requirements.txt
  artifacts:
    when: always
    paths:
      - bandit-report.json
      - pip-audit-report.json
    expire_in: 30 days
  allow_failure: true  # integration progressive — passer a false apres stabilisation
  only:
    - main
    - merge_requests

# ─── Build image Docker ARM64 (Jetson Orin NX) ───────────────────────────────
build:docker:arm64:
  stage: build
  image: docker:25-cli
  services:
    - docker:25-dind
  before_script:
    - echo "Nettoyage de l'espace disque..."
    - docker system prune -af --volumes || true
    - df -h
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  script:
    - echo "Construction de l'image Docker ARM64..."
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    - docker buildx build
        --platform linux/arm64
        --target final-arm64
        --build-arg PYTHON_VERSION=3.10
        --tag ${IMAGE_NAME}:${IMAGE_TAG}-arm64
        --tag ${IMAGE_NAME}:latest-arm64
        --push --progress=plain .
    - echo "Image creee: ${IMAGE_NAME}:${IMAGE_TAG}-arm64"
  after_script:
    - docker system prune -f || true
  only:
    - main
    - jetson_gpu
    - tags

# ─── Build image Docker AMD64 (Intel iGPU / x86_64) ──────────────────────────
build:docker:amd64:
  stage: build
  image: docker:25-cli
  services:
    - docker:25-dind
  before_script:
    - echo "Nettoyage de l'espace disque..."
    - docker system prune -af --volumes || true
    - df -h
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Construction de l'image Docker AMD64..."
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    - docker buildx build
        --platform linux/amd64
        --target final-amd64
        --build-arg PYTHON_VERSION=3.10
        --tag ${IMAGE_NAME}:${IMAGE_TAG}-amd64
        --tag ${IMAGE_NAME}:latest-amd64
        --push --progress=plain .
    - echo "Image creee: ${IMAGE_NAME}:${IMAGE_TAG}-amd64"
  after_script:
    - docker system prune -f || true
  only:
    - main
    - tags

# ─── Release avec instructions de deploiement ────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies: []
  script:
    - echo "Creation de la release ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      ## Release Docker Multi-Arch $CI_COMMIT_TAG

      ### Images disponibles

      | Architecture | Image |
      |---|---|
      | ARM64 (Jetson Orin NX) | `${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64` |
      | AMD64 (Intel iGPU)     | `${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64` |

      ### Deploiement ARM64 (Jetson)
      ```bash
      docker login gitlab.4itec.ddns.net
      docker pull ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64
      docker run -d \
        --name 4isafecross \
        --runtime nvidia \
        --restart unless-stopped \
        --privileged \
        -p 5000:5000 \
        -v /data/4isafecross:/app/data \
        ${IMAGE_NAME}:${CI_COMMIT_TAG}-arm64
      ```

      ### Deploiement AMD64 (Intel iGPU)
      ```bash
      docker login gitlab.4itec.ddns.net
      docker pull ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64
      docker run -d \
        --name 4isafecross \
        --restart unless-stopped \
        --device /dev/dri \
        -p 5000:5000 \
        -v /data/4isafecross:/app/data \
        ${IMAGE_NAME}:${CI_COMMIT_TAG}-amd64
      ```

      **Verifier les logs:**
      ```bash
      docker logs -f 4isafecross
      ```
  only:
    - tags
  except:
    - branches
