[project]
name = "4isafecross"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiogram>=3.29.0",
    "aiohttp>=3.14.1",
    "cryptography>=48.0.0",
    "flask>=3.1.1",
    "license-validator==0.2.2",
    "opencv-python>=4.11.0.86",
    "psutil>=7.0.0",
    # pygobject nécessite libgirepository1.0-dev (apt) pour la compilation
    # Voir docs/deployment/install-system-deps.md pour les commandes complètes par plateforme
    "pygobject<3.51.0; platform_system != 'Windows'",
    "requests>=2.32.3",
    "setuptools>=80.8.0",
    "waitress>=3.0.2",
    "yoctopuce>=2.1.6320",
]

[dependency-groups]
# Outillage de développement et de CI. Exclu des images par le
# `uv sync --frozen --no-dev` du Dockerfile : ces paquets n'ont rien à faire
# dans le venv de production.
#
# gunicorn a été retiré des dépendances d'exécution : run.py sert avec waitress,
# et gunicorn avait été explicitement abandonné (commit 6409dea) parce que le
# fork casse GStreamer. Il n'était plus référencé que dans une ligne commentée.
#
# nuitka est ici et non en dépendance d'exécution : le build image utilise
# Cython (setup_cython.py), Nuitka ne sert plus qu'à scripts/test-build-local.sh.
dev = [
    "bandit>=1.8.0",
    "nuitka>=2.7.12",
    "pip-audit>=2.9.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
license-validator = { index = "gitlab-license-validator" }

[[tool.uv.index]]
name = "gitlab-license-validator"
url = "https://gitlab.4itec.ddns.net/api/v4/projects/38/packages/pypi/simple"
explicit = true