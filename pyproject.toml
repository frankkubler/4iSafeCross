[project]
name = "4isafecross"
version = "3.0.13"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiogram>=3.29.0",
    # aiohttp >= 3.14.3 : correctifs de sécurité (CYBER_AUDIT.md — CS-R6-01).
    "aiohttp>=3.14.3",
    # cryptography >= 50.0.0 : correctifs de sécurité (CYBER_AUDIT.md — CS-R6-01).
    "cryptography>=50.0.0",
    "flask>=3.1.1",
    "license-validator==0.2.2",
    "opencv-python>=4.11.0.86",
    "psutil>=7.0.0",
    # pygobject nécessite libgirepository1.0-dev (apt) pour la compilation
    # Voir docs/deployment/install-system-deps.md pour les commandes complètes par plateforme
    "pygobject<3.51.0; platform_system != 'Windows'",
    "requests>=2.32.3",
    # setuptools / cython / wheel ne sont PAS des dépendances d'exécution
    # (aucun `import setuptools`/`pkg_resources` dans src/ ou utils/). Ils sont
    # installés à la volée dans le stage builder du Dockerfile pour la seule
    # compilation Cython (setup_cython.py), puis désinstallés du venv avant la
    # copie vers le stage final (CYBER_AUDIT.md — CS-128-01 / CS-127-02).
    "waitress>=3.0.2",
    "yoctopuce>=2.1.6320",
]

[dependency-groups]
# Outillage de développement et de CI. Exclu des images par le
# `uv sync --frozen --no-dev` du Dockerfile : ces paquets n'ont rien à faire
# dans le venv de production.
#
# gunicorn a été retiré des dépendances d'exécution : run.py sert avec waitress,
# et gunicorn avait été explicitement abandonné (commit 6409dea) parce que le
# fork casse GStreamer. Il n'était plus référencé que dans une ligne commentée.
#
# nuitka est ici et non en dépendance d'exécution : le build image utilise
# Cython (setup_cython.py), Nuitka ne sert plus qu'à scripts/test-build-local.sh.
dev = [
    "bandit>=1.8.0",
    "nuitka>=2.7.12",
    "pip-audit>=2.9.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
# Point de départ volontairement modeste : un jeu de règles que le code peut
# satisfaire à court terme, plutôt qu'un catalogue qui ferait 500 remarques et
# qu'on finirait par ignorer. À élargir famille par famille, chacune dans son
# propre commit.
target-version = "py310"          # la plus basse de requires-python
line-length = 120                 # 54 lignes dépassent déjà 120, 184 dépassent 100
exclude = [
    ".venv", "__pycache__", ".ruff_cache", ".pytest_cache",
    "dataset", "detections", "logs", "db", "licenses",
    "static/js/fabric.min.js",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # erreurs pycodestyle (hors E501 : longueur de ligne)
    "F",                # pyflakes : imports et variables inutilisés, noms inconnus
    "I",                # tri des imports (remplace isort)
    "UP",               # tournures obsolètes (pyupgrade)
]
ignore = [
    # Le dépôt vit sur un montage NTFS (fuseblk) qui présente TOUS les fichiers en
    # 755 : cette règle n'y mesure rien. Git enregistre bien 100644 pour les 44
    # fichiers .py, et core.fileMode est à false.
    "EXE002",
]

[tool.ruff.lint.per-file-ignores]
# Les scripts de collecte importent volontairement après avoir réglé
# l'environnement GStreamer : l'ordre y est fonctionnel, pas stylistique.
"src/camera_manager.py" = ["E402"]

[tool.uv.sources]
license-validator = { index = "gitlab-license-validator" }

[[tool.uv.index]]
name = "gitlab-license-validator"
url = "https://gitlab.4itec.ddns.net/api/v4/projects/38/packages/pypi/simple"
explicit = true